name: ci

on:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check . --exclude "tests/*.ipynb" --exclude "src/"
          ruff format --check . --exclude "tests/*.ipynb" --exclude "src/"
   
      - name: Tests
        env: 
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q