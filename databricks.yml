bundle:
  name: openfema_lakehouse_e2e

include:   
  - src/env/*.yml
  - resources/jobs/*.yml
  - resources/pipelines/*.yml

variables:
  environment:
    default: dev
  paginator_limit:
    default: 3
  paginator_maximum_offset:
    default: 100

targets:
  dev: 
    mode: development
    default: true
      
  stg: 
    mode: production
  
  prod:
    mode: production 