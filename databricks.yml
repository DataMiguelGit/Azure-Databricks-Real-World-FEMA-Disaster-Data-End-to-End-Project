bundle:
  name: openfema_lakehouse_e2e

include:   
  - src/env/*.yml
  - resources/jobs/*.yml
  - resources/pipelines/*.yml

targets:
  dev: 
    mode: development
    default: true
    variables: 
      environment: dev
  
  stg: 
    mode: production
    variables:
      environment: stg

  
  prod:
    mode: production
    variables:
      environment: prod
 