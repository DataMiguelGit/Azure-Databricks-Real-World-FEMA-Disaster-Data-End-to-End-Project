resources:
  jobs:
    openfema_ingest:
      name: openfema_ingest_${bundle.target}
      tasks:
        - task_key: extract_openfema
          spark_python_task:
            python_file: ../../src/openfema/m1/openfema_extract.py
            parameters:
              - --paginator-limit
              - ${var.paginator_limit}
              - --paginator-maximum-offset
              - ${var.paginator_maximum_offset}
          new_cluster:
            spark_version: "16.4.x-scala2.12"
            node_type_id: "Standard_DC4as_v5"
            num_workers: 0
            spark_env_vars:
              PYTHONPATH: "${workspace.file_path}"
